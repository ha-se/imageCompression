name: Kintone画像圧縮バッチ

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分 (UTC基準)。Kintone API上限やGitHub Actionsの実行時間消費に応じて調整可
  workflow_dispatch:
    inputs:
      batch_size:
        description: '処理レコード上限 (0 = 無制限)'
        required: false
        default: '100'
      enable_delete:
        description: '古い画像の削除を有効化'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      enable_archive:
        description: '古い画像をS3へ退避してKintoneから削除'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      enable_record_archive:
        description: '古いレコード全体をS3へアーカイブしてKintoneから削除'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      full_scan:
        description: 'フルスキャン (差分モードを無効化)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      timeout:
        description: 'タイムアウト（分）'
        required: false
        default: '60'
      archive_query:
        description: 'アーカイブ/削除対象のKintoneクエリ（空なら保持期間で判定）'
        required: false
        default: ''

concurrency:
  group: kintone-image-batch
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout || '60') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: バッチ実行
        id: batch
        run: |
          npx tsx src/index.ts 2>&1 | tee /tmp/batch-output.log
          # ログから走査済み最大更新日時を抽出してGitHub Actionsの出力に設定
          LAST_UPDATED_AT=$(grep -oP 'LAST_PROCESSED_UPDATED_AT=\K\S+' /tmp/batch-output.log || echo "")
          echo "last_processed_updated_at=$LAST_UPDATED_AT" >> "$GITHUB_OUTPUT"
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP_ID }}
          KINTONE_ATTACHMENT_FIELD: ${{ secrets.KINTONE_ATTACHMENT_FIELD }}
          MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB || '1' }}
          TARGET_QUALITY: ${{ vars.TARGET_QUALITY || '80' }}
          RETENTION_MONTHS: ${{ vars.RETENTION_MONTHS || '3' }}
          ENABLE_ARCHIVE_OLD_RECORDS: ${{ github.event.inputs.enable_record_archive || vars.ENABLE_ARCHIVE_OLD_RECORDS || 'false' }}
          ENABLE_ARCHIVE_OLD_IMAGES: ${{ github.event.inputs.enable_archive || vars.ENABLE_ARCHIVE_OLD_IMAGES || 'false' }}
          ENABLE_DELETE_OLD_IMAGES: ${{ github.event.inputs.enable_delete || vars.ENABLE_DELETE_OLD_IMAGES || 'false' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MAX_API_CALLS: ${{ vars.MAX_API_CALLS || '9000' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || vars.BATCH_SIZE || '100' }}
          LAST_PROCESSED_UPDATED_AT: ${{ github.event.inputs.full_scan == 'true' && '' || vars.LAST_PROCESSED_UPDATED_AT || '' }}
          ARCHIVE_QUERY: ${{ github.event.inputs.archive_query || '' }}

      - name: LAST_PROCESSED_UPDATED_AT を更新
        if: steps.batch.outputs.last_processed_updated_at != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set LAST_PROCESSED_UPDATED_AT --body "${{ steps.batch.outputs.last_processed_updated_at }}"
          echo "LAST_PROCESSED_UPDATED_AT を ${{ steps.batch.outputs.last_processed_updated_at }} に更新しました"
